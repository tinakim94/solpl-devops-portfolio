name: Example - Deploy Frontend

on:
  workflow_dispatch:

# Sanitized portfolio example.
# Replace placeholders only with non-sensitive demo values.
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Sync frontend example
        run: |
          echo "aws s3 sync ./frontend s3://YOUR_BUCKET_NAME --delete"

      - name: CloudFront invalidation example
        run: |
          echo "aws cloudfront create-invalidation --distribution-id YOUR_DISTRIBUTION_ID --paths '/*'"
