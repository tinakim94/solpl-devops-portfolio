name: Example - Deploy Lambda

on:
  workflow_dispatch:

# Sanitized portfolio example.
# This workflow is intentionally non-production and uses placeholders.
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Package Lambda example
        run: |
          echo "Replace this step with your sanitized Lambda package command"

      - name: Deploy Lambda example
        run: |
          echo "aws lambda update-function-code --function-name YOUR_FUNCTION_NAME --zip-file fileb://function.zip"
